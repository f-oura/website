# -- Theme Options --
# https://jpanther.github.io/congo/docs/configuration/#theme-parameters

colorScheme = "laboratory"
defaultAppearance = "dark"
autoSwitchAppearance = false

description = "Experimental nuclear physicist at JAEA, studying hadron and nuclear physics at J-PARC and RHIC"
mainSections = ["publications", "research"]

[author]
  name = "Fumiya Oura"
  # image = "img/author.jpg"
  headline = "Experimental nuclear physicist"
  bio = "JAEA / Advanced Science Research Center"
  links = [
    { github = "https://github.com/f-oura" },
    { orcid = "https://orcid.org/0009-0005-9504-7120" },
    { researchmap = "https://researchmap.jp/fumiyaoura" },
    { email = "mailto:ohura.fumiya@jaea.go.jp" },
  ]

[homepage]
  layout = "profile"
  showRecent = false

[header]
  layout = "basic"
  # logo = "img/logo.jpg"
  # logoDark = "img/logo-dark.jpg"
  showTitle = true

[footer]
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = false
  showScrollToTop = false

[article]
  showDate = true
  dateFormat = "2006-01-02"
  showAuthor = true
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  editAppendPath = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = false
  showWordCount = false
  showTableOfContents = true

[list]
  showBreadcrumbs = true
  showSummary = true
  groupByYear = false
  showCards = true

[taxonomy]
  showTermCount = true

[sitemap]
  excludedKinds = ["taxonomy", "term"]
