# -- Theme Options --
# https://jpanther.github.io/congo/docs/configuration/#theme-parameters

colorScheme = "laboratory"
defaultAppearance = "light"
autoSwitchAppearance = false

description = "Nuclear and Particle Physics Researcher at JAEA"
mainSections = ["publications", "research"]

[author]
  name = "Fumiya Oura"
  # image = "img/author.jpg"
  headline = "Nuclear & Particle Physics Researcher"
  bio = "JAEA / Advanced Science Research Center"
  links = [
    { github = "https://github.com/f-oura" },
    { orcid = "https://orcid.org/0000-0000-0000-0000" },
    { linkedin = "https://linkedin.com/in/fumiya-oura" },
    { researchmap = "https://researchmap.jp/your-id" },
    { email = "mailto:oura@example.com" },
  ]

[homepage]
  layout = "profile"
  showRecent = false

[header]
  layout = "basic"
  # logo = "img/logo.jpg"
  # logoDark = "img/logo-dark.jpg"
  showTitle = true

[footer]
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[article]
  showDate = true
  dateFormat = "2006-01-02"
  showAuthor = true
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  editAppendPath = true
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = false
  showWordCount = false
  showTableOfContents = true

[list]
  showBreadcrumbs = true
  showSummary = true
  groupByYear = false
  showCards = true

[taxonomy]
  showTermCount = true

[sitemap]
  excludedKinds = ["taxonomy", "term"]
