<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hadron Background</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overflow:hidden;background:#0e0f10;width:100%;height:100%;}
  canvas{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');

// Fixed config: 7 baryons, 5 mesons
let CONFIG = { baryons: 7, mesons: 5, speed: 1.2 };
const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
let animationFrame = null;

let W,H;
function resize(){
  W=cv.width=window.innerWidth;
  H=cv.height=window.innerHeight;
}
resize();
window.addEventListener('resize',resize);

const fg=a=>`rgba(255,255,255,${a})`;

// ---- constants ----
const R_Q=3.0, R_H=20;
const M_B=1.0, M_M=0.15;
const E_RELEASE=0.8;
const KE_INELASTIC=0.8, KE_MULTI=2.0;
const BIND_DIST=R_H*2.6, BIND_TIME=30;
const D_POS=R_H*2.8, D_MOM=0.55, PAULI_MAX=4, PAULI_STR=0.055;
const aV=0.9, aS=0.7;
const ABSORPTION_RANGE=R_H*5.0;
const M_PI_EFF=0.6;
const V_PI_ESCAPE=0.6;

function getSpeedScale(){ return CONFIG.speed * 0.4; }

// ---- helpers ----
function baryonNum(nq){return nq===3?1:nq===-3?-1:0;}
function relKE(a,b){const dvx=a.vx-b.vx,dvy=a.vy-b.vy;return 0.5*(dvx*dvx+dvy*dvy);}
function nPairsFromKE(rke){return Math.min(4,1+Math.floor((rke-KE_INELASTIC)/0.8));}
function bindingEnergy(n){return n<2?0:Math.max(0.3,aV*n-aS*Math.pow(n,2/3));}

function bbForce(d){
  const rep=R_H*1.9,eq=R_H*2.8;
  if(d<rep)return-(0.07*(rep-d)/rep);
  if(d<190)return 0.017*Math.exp(-(d-eq)*(d-eq)/(2*40*40));
  return 0;
}
function bmForce(d){return d<200?0.019*(1-d/200):0;}
function mmForce(d){return d<120?-0.004*(1-d/120):0;}
function bBbarForce(d){return d<280?0.045*(1-d/280):0;}

function pauliCell(h){
  return{px:Math.round(h.x/D_POS),py:Math.round(h.y/D_POS),
         mx:Math.round(h.vx/D_MOM),my:Math.round(h.vy/D_MOM)};
}
function applyPauli(baryons){
  const cells=new Map();
  baryons.forEach(h=>{
    const c=pauliCell(h),k=`${c.px},${c.py},${c.mx},${c.my}`;
    if(!cells.has(k))cells.set(k,[]);
    cells.get(k).push(h);
  });
  cells.forEach(members=>{
    if(members.length<=PAULI_MAX)return;
    for(let i=0;i<members.length;i++)for(let j=i+1;j<members.length;j++){
      const a=members[i],b=members[j];
      const dvx=a.vx-b.vx,dvy=a.vy-b.vy,dp=Math.sqrt(dvx*dvx+dvy*dvy)+0.001;
      if(dp<D_MOM*2){
        const kick=PAULI_STR*(1-dp/(D_MOM*2)),nx=dvy/dp,ny=-dvx/dp;
        a.vx+=nx*kick;a.vy+=ny*kick;b.vx-=nx*kick;b.vy-=ny*kick;
      }
    }
  });
}

let idC=0;function uid(){return++idC;}

// ============================================================
//  Hadron class
// ============================================================
class Hadron{
  constructor(x,y,nq){
    this.id=uid();this.nq=nq;
    this.x=x;this.y=y;
    const ss=Math.max(0.1, getSpeedScale());
    this.vx=(Math.random()-0.5)*ss*1.4;
    this.vy=(Math.random()-0.5)*ss*1.4;
    this.quarks=Array.from({length:Math.abs(nq)},(_,i)=>{
      const a=(i/Math.abs(nq))*Math.PI*2+Math.random()*0.4;
      return{lx:Math.cos(a)*8,ly:Math.sin(a)*8,
             vlx:(Math.random()-0.5)*0.3,vly:(Math.random()-0.5)*0.3};
    });
    this.pauliKick=0;this.bond=null;this.attract=null;
    this.nearTime=new Map();
    this.btbFlash=0;
    this.escaped=false;
  }

  updateQuarks(){
    const eq=R_H*0.36;
    this.quarks.forEach(q=>{
      const dist=Math.sqrt(q.lx*q.lx+q.ly*q.ly)||0.1;
      const f=(dist-eq)*0.018;
      q.vlx-=(q.lx/dist)*f;q.vly-=(q.ly/dist)*f;
      this.quarks.forEach(o=>{
        if(o===q)return;
        const dx=q.lx-o.lx,dy=q.ly-o.ly,d=Math.sqrt(dx*dx+dy*dy)+0.1;
        if(d<15){q.vlx+=dx/d*0.06;q.vly+=dy/d*0.06;}
      });
      q.vlx*=0.97;q.vly*=0.97;q.lx+=q.vlx;q.ly+=q.vly;
    });
  }

  move(){
    this.x+=this.vx;this.y+=this.vy;
    if(this.escaped){
      if(this.x<-R_H*2||this.x>W+R_H*2||this.y<-R_H*2||this.y>H+R_H*2){
        this.dead=true;
      }
      return;
    }
    const m=R_H+8;
    if(this.x<m){this.x=m;this.vx=Math.abs(this.vx);}
    if(this.x>W-m){this.x=W-m;this.vx=-Math.abs(this.vx);}
    if(this.y<m){this.y=m;this.vy=Math.abs(this.vy);}
    if(this.y>H-m){this.y=H-m;this.vy=-Math.abs(this.vy);}
    this.vx*=0.999;this.vy*=0.999;
    if(this.pauliKick>0)this.pauliKick-=0.05;
    if(this.btbFlash>0)this.btbFlash-=0.035;
    this.updateQuarks();
  }

  draw(alpha){
    const isAnti=this.nq<0;
    const pk=Math.max(0,this.pauliKick);
    const btb=Math.max(0,this.btbFlash);

    if(btb>0.05){
      [btb*22,btb*11].forEach((r,i)=>{
        ctx.beginPath();ctx.arc(this.x,this.y,R_H+r,0,Math.PI*2);
        ctx.strokeStyle=fg(btb*(i===0?0.38:0.18));
        ctx.lineWidth=i===0?1.2:0.7;ctx.stroke();
      });
    }
    if(pk>0.1&&Math.abs(this.nq)===3){
      ctx.beginPath();ctx.arc(this.x,this.y,R_H+pk*4,0,Math.PI*2);
      ctx.strokeStyle=fg(pk*0.28);ctx.lineWidth=0.8;ctx.stroke();
    }

    ctx.beginPath();ctx.arc(this.x,this.y,R_H,0,Math.PI*2);
    if(isAnti)ctx.setLineDash([3,3]);
    ctx.strokeStyle=fg(alpha*(isAnti?0.20:0.10));
    ctx.lineWidth=isAnti?1.0:0.7;ctx.stroke();ctx.setLineDash([]);

    for(let i=0;i<this.quarks.length;i++){
      const qi=this.quarks[i],qj=this.quarks[(i+1)%this.quarks.length];
      ctx.beginPath();ctx.moveTo(this.x+qi.lx,this.y+qi.ly);
      ctx.lineTo(this.x+qj.lx,this.y+qj.ly);
      ctx.strokeStyle=fg(alpha*0.16);ctx.lineWidth=0.6;ctx.stroke();
    }
    if(Math.abs(this.nq)===3){
      const cx2=this.quarks.reduce((s,q)=>s+q.lx,0)/3;
      const cy2=this.quarks.reduce((s,q)=>s+q.ly,0)/3;
      this.quarks.forEach(q=>{
        ctx.beginPath();ctx.moveTo(this.x+cx2,this.y+cy2);
        ctx.lineTo(this.x+q.lx,this.y+q.ly);
        ctx.strokeStyle=fg(alpha*0.11);ctx.lineWidth=0.5;ctx.stroke();
      });
    }
    this.quarks.forEach((q,i)=>{
      ctx.beginPath();ctx.arc(this.x+q.lx,this.y+q.ly,R_Q,0,Math.PI*2);
      if(isAnti){ctx.strokeStyle=fg(alpha*0.78);ctx.lineWidth=1.0;ctx.stroke();}
      else if(Math.abs(this.nq)===3){ctx.fillStyle=fg(alpha*0.86);ctx.fill();}
      else{
        if(i===0){ctx.fillStyle=fg(alpha*0.86);ctx.fill();}
        else{ctx.strokeStyle=fg(alpha*0.76);ctx.lineWidth=0.9;ctx.stroke();}
      }
    });
  }
}

// ============================================================
//  Nucleus class
// ============================================================
class Nucleus{
  constructor(members){
    this.id=uid();
    this.x=members.reduce((s,h)=>s+h.x,0)/members.length;
    this.y=members.reduce((s,h)=>s+h.y,0)/members.length;
    this.vx=members.reduce((s,h)=>s+h.vx,0)/members.length;
    this.vy=members.reduce((s,h)=>s+h.vy,0)/members.length;
    this.members=members.map(h=>({
      nq:h.nq,rx:h.x-this.x,ry:h.y-this.y,
      rvx:h.vx-this.vx,rvy:h.vy-this.vy,
      quarks:h.quarks,id:h.id,
    }));
    this.nBaryons=members.filter(h=>Math.abs(h.nq)===3).length;
    this.nMesons=members.filter(h=>Math.abs(h.nq)===2).length;
    this.bindE=bindingEnergy(this.nBaryons);
    this.radius=R_H*(0.8+0.55*Math.pow(this.nBaryons,1/3));
    this.excitation=0;
  }

  updateInternal(){
    const N=this.members.length;
    const ss=getSpeedScale();
    this.members.forEach((a,i)=>{
      const dist=Math.sqrt(a.rx*a.rx+a.ry*a.ry)||0.1;
      const confineR=this.radius*0.55;
      const fc=(dist-confineR)*0.012;
      a.rvx-=(a.rx/dist)*fc;a.rvy-=(a.ry/dist)*fc;
      this.members.forEach((b,j)=>{
        if(i>=j)return;
        const dx=b.rx-a.rx,dy=b.ry-a.ry,d=Math.sqrt(dx*dx+dy*dy)||0.1;
        if(Math.abs(a.nq)===3&&Math.abs(b.nq)===3){
          const f=bbForce(d)*0.6;
          a.rvx+=dx/d*f;a.rvy+=dy/d*f;
          b.rvx-=dx/d*f;b.rvy-=dy/d*f;
        }
        const dvx=a.rvx-b.rvx,dvy=a.rvy-b.rvy,dp=Math.sqrt(dvx*dvx+dvy*dvy)+0.001;
        if(dp<D_MOM*1.5){
          const kick=PAULI_STR*0.5*(1-dp/(D_MOM*1.5)),nx=dvy/dp,ny=-dvx/dp;
          a.rvx+=nx*kick;a.rvy+=ny*kick;b.rvx-=nx*kick;b.rvy-=ny*kick;
        }
      });
      const thermalKick=ss*0.003;
      a.rvx+=(Math.random()-0.5)*thermalKick;
      a.rvy+=(Math.random()-0.5)*thermalKick;
      a.rvx*=0.995;a.rvy*=0.995;a.rx+=a.rvx;a.ry+=a.rvy;
      if(a.quarks){
        const eq=R_H*0.36;
        a.quarks.forEach(q=>{
          const d2=Math.sqrt(q.lx*q.lx+q.ly*q.ly)||0.1,f=(d2-eq)*0.018;
          q.vlx-=(q.lx/d2)*f;q.vly-=(q.ly/d2)*f;
          a.quarks.forEach(o=>{
            if(o===q)return;
            const ddx=q.lx-o.lx,ddy=q.ly-o.ly,dd=Math.sqrt(ddx*ddx+ddy*ddy)+0.1;
            if(dd<15){q.vlx+=ddx/dd*0.06;q.vly+=ddy/dd*0.06;}
          });
          q.vlx*=0.97;q.vly*=0.97;q.lx+=q.vlx;q.ly+=q.vly;
        });
      }
    });
    const cmrvx=this.members.reduce((s,m)=>s+m.rvx,0)/N;
    const cmrvy=this.members.reduce((s,m)=>s+m.rvy,0)/N;
    this.members.forEach(m=>{m.rvx-=cmrvx;m.rvy-=cmrvy;});

    // Escape check
    if(this.members.length<2)return;
    const Ebind=this.bindE;
    let internalKE=0;
    this.members.forEach(m=>internalKE+=0.5*(m.rvx*m.rvx+m.rvy*m.rvy));
    if(internalKE<=Ebind)return;

    let maxKE=0,escapeIdx=-1;
    this.members.forEach((m,i)=>{
      const ke=0.5*(m.rvx*m.rvx+m.rvy*m.rvy);
      if(ke>Ebind/this.members.length&&ke>maxKE){maxKE=ke;escapeIdx=i;}
    });
    if(escapeIdx<0)return;

    const em=this.members[escapeIdx];
    const escaped=new Hadron(this.x+em.rx,this.y+em.ry,em.nq);
    escaped.vx=this.vx+em.rvx;
    escaped.vy=this.vy+em.rvy;
    escaped.quarks=em.quarks;
    freeHadrons.push(escaped);
    this.members.splice(escapeIdx,1);

    this.nBaryons=this.members.filter(m=>Math.abs(m.nq)===3).length;
    this.nMesons=this.members.filter(m=>Math.abs(m.nq)===2).length;
    this.bindE=bindingEnergy(this.nBaryons);
    this.radius=R_H*(0.8+0.55*Math.pow(Math.max(1,this.nBaryons),1/3));
    this.excitation=0.6;
    addSparks(this.x,this.y,6,false);
  }

  move(){
    this.x+=this.vx;this.y+=this.vy;
    const m=this.radius+10;
    if(this.x<m){this.x=m;this.vx=Math.abs(this.vx);}
    if(this.x>W-m){this.x=W-m;this.vx=-Math.abs(this.vx);}
    if(this.y<m){this.y=m;this.vy=Math.abs(this.vy);}
    if(this.y>H-m){this.y=H-m;this.vy=-Math.abs(this.vy);}
    this.vx*=0.999;this.vy*=0.999;
    if(this.excitation>0)this.excitation-=0.01;
    this.updateInternal();
  }

  dissolve(){
    return this.members.map(m=>{
      const h=new Hadron(this.x+m.rx,this.y+m.ry,m.nq);
      h.vx=this.vx+m.rvx;h.vy=this.vy+m.rvy;
      h.quarks=m.quarks;return h;
    });
  }

  draw(alpha){
    const ex=Math.max(0,this.excitation);
    ctx.beginPath();ctx.arc(this.x,this.y,this.radius,0,Math.PI*2);
    ctx.strokeStyle=fg(0.18+ex*0.15);ctx.lineWidth=0.8;ctx.stroke();
    this.members.forEach(m=>{
      const wx=this.x+m.rx,wy=this.y+m.ry,isAnti=m.nq<0;
      ctx.beginPath();ctx.arc(wx,wy,R_H,0,Math.PI*2);
      if(isAnti)ctx.setLineDash([3,3]);
      ctx.strokeStyle=fg(alpha*(isAnti?0.18:0.09));
      ctx.lineWidth=0.6;ctx.stroke();ctx.setLineDash([]);
      if(m.quarks){
        for(let i=0;i<m.quarks.length;i++){
          const qi=m.quarks[i],qj=m.quarks[(i+1)%m.quarks.length];
          ctx.beginPath();ctx.moveTo(wx+qi.lx,wy+qi.ly);ctx.lineTo(wx+qj.lx,wy+qj.ly);
          ctx.strokeStyle=fg(alpha*0.14);ctx.lineWidth=0.5;ctx.stroke();
        }
        if(Math.abs(m.nq)===3){
          const cx2=m.quarks.reduce((s,q)=>s+q.lx,0)/3;
          const cy2=m.quarks.reduce((s,q)=>s+q.ly,0)/3;
          m.quarks.forEach(q=>{
            ctx.beginPath();ctx.moveTo(wx+cx2,wy+cy2);ctx.lineTo(wx+q.lx,wy+q.ly);
            ctx.strokeStyle=fg(alpha*0.09);ctx.lineWidth=0.4;ctx.stroke();
          });
        }
        m.quarks.forEach((q,i)=>{
          ctx.beginPath();ctx.arc(wx+q.lx,wy+q.ly,R_Q,0,Math.PI*2);
          if(isAnti){ctx.strokeStyle=fg(alpha*0.72);ctx.lineWidth=0.9;ctx.stroke();}
          else if(Math.abs(m.nq)===3){ctx.fillStyle=fg(alpha*0.82);ctx.fill();}
          else{
            if(i===0){ctx.fillStyle=fg(alpha*0.82);ctx.fill();}
            else{ctx.strokeStyle=fg(alpha*0.70);ctx.lineWidth=0.8;ctx.stroke();}
          }
        });
      }
    });
  }
}

// ============================================================
//  Utilities
// ============================================================
function absorptionBTB(b1,b2,m){
  const Mtot=M_B+M_B+M_M;
  const cmvx=(M_B*b1.vx+M_B*b2.vx+M_M*m.vx)/Mtot;
  const cmvy=(M_B*b1.vy+M_B*b2.vy+M_M*m.vy)/Mtot;
  const b1cmvx=b1.vx-cmvx,b1cmvy=b1.vy-cmvy;
  const b2cmvx=b2.vx-cmvx,b2cmvy=b2.vy-cmvy;
  const keIn=0.5*M_B*(b1cmvx*b1cmvx+b1cmvy*b1cmvy)+0.5*M_B*(b2cmvx*b2cmvx+b2cmvy*b2cmvy);
  const Etot=E_RELEASE+keIn;
  const v_btb=Math.sqrt(Etot/M_B);
  const relAngle=Math.atan2(b1.vy-b2.vy,b1.vx-b2.vx);
  const scatter=(Math.random()-0.5)*Math.PI*0.4;
  const angle=relAngle+scatter;
  const nx=Math.cos(angle),ny=Math.sin(angle);
  b1.vx=cmvx+nx*v_btb;b1.vy=cmvy+ny*v_btb;
  b2.vx=cmvx-nx*v_btb;b2.vy=cmvy-ny*v_btb;
  b1.btbFlash=1.0;b2.btbFlash=1.0;
  return{v_btb,cmvx,cmvy};
}

function ensureBaryonNumber(newH,bnTarget){
  let bn=newH.reduce((s,h)=>s+baryonNum(h.nq),0);
  while(bn<bnTarget){newH.push(new Hadron(W/2+(-30+Math.random()*60),H/2+(-30+Math.random()*60),3));bn++;}
  while(bn>bnTarget){newH.push(new Hadron(W/2+(-30+Math.random()*60),H/2+(-30+Math.random()*60),-3));bn--;}
}

function formHadrons(mx,my,nQ,nQbar,cmvx,cmvy){
  const newH=[];let q=nQ,qb=nQbar;
  while(q>=3){const a=Math.random()*Math.PI*2,r=18+Math.random()*28;newH.push(new Hadron(mx+Math.cos(a)*r,my+Math.sin(a)*r,3));q-=3;}
  while(qb>=3){const a=Math.random()*Math.PI*2,r=18+Math.random()*28;newH.push(new Hadron(mx+Math.cos(a)*r,my+Math.sin(a)*r,-3));qb-=3;}
  const pairs=Math.min(q,qb);
  for(let i=0;i<pairs;i++){const a=Math.random()*Math.PI*2,r=14+Math.random()*32;newH.push(new Hadron(mx+Math.cos(a)*r,my+Math.sin(a)*r,2));}
  if(q!==qb){const a=Math.random()*Math.PI*2,r=14+Math.random()*32;newH.push(new Hadron(mx+Math.cos(a)*r,my+Math.sin(a)*r,2));}
  const spd=Math.max(0.4,Math.sqrt(cmvx*cmvx+cmvy*cmvy)*0.7/Math.max(1,newH.length));
  newH.forEach(h=>{const a=Math.atan2(h.y-my,h.x-mx);h.vx=cmvx*0.3+Math.cos(a)*spd;h.vy=cmvy*0.3+Math.sin(a)*spd;});
  return newH;
}

function emitPion(cx,cy,angle,vPI,cmVel,members,nMembers){
  const escaped=vPI>=V_PI_ESCAPE;
  const clusterR=R_H*(0.8+0.55*Math.pow(Math.max(1,nMembers),1/3));
  const spawnR=escaped ? clusterR+R_H*1.5 : R_H*1.2;
  const pi=new Hadron(cx+Math.cos(angle)*spawnR,cy+Math.sin(angle)*spawnR,2);
  pi.vx=cmVel.vx+Math.cos(angle)*vPI;
  pi.vy=cmVel.vy+Math.sin(angle)*vPI;
  pi.escaped=escaped;
  const recoil=M_M*vPI/Math.max(nMembers,1);
  members.forEach(h=>{h.vx-=Math.cos(angle)*recoil; h.vy-=Math.sin(angle)*recoil;});
  cmVel.vx-=Math.cos(angle)*recoil;
  cmVel.vy-=Math.sin(angle)*recoil;
  freeHadrons.push(pi);
  return escaped;
}

function emitGammas(x,y,nGammas,excessEnergy,sourceMembers,sourceCMVel){
  for(let i=0;i<nGammas;i++){
    const angle=Math.random()*Math.PI*2;
    const amp=2.5+Math.min(excessEnergy*2.0,4.0);
    const wl=8+Math.random()*4;
    gammas.push({
      ox:x, oy:y, angle, dist:0,
      speed:6.0+Math.random()*2.0,
      wavelength:wl, amplitude:amp,
      life:1.0, decay:0.018+Math.random()*0.010,
      energy:excessEnergy,
    });
    const ePerGamma=excessEnergy/nGammas;
    const factor=Math.max(0.3, 1.0-ePerGamma*0.35);
    if(sourceMembers){
      sourceMembers.forEach(m=>{m.rvx*=factor;m.rvy*=factor;});
    }
    if(sourceCMVel){
      const recoil=ePerGamma*0.06;
      sourceCMVel.vx-=Math.cos(angle)*recoil;
      sourceCMVel.vy-=Math.sin(angle)*recoil;
    }
  }
}

// ============================================================
//  State
// ============================================================
let freeHadrons=[],nuclei=[],sparks=[],gammas=[];
let frame=0,interactCooldown=0,absorptionCooldown=0;
let totalBaryonInit=0;

function addSparks(x,y,n,big){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,spd=(big?1.2:0.5)+Math.random()*(big?3.0:1.8);
    sparks.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,r:big?1.8+Math.random()*2.5:0.8+Math.random()*1.2});
  }
}

function randPos(){return[R_H+40+Math.random()*(W-R_H*2-80),R_H+40+Math.random()*(H-R_H*2-80)];}

function init(){
  freeHadrons=[];nuclei=[];sparks=[];gammas=[];
  const nb=CONFIG.baryons,nm=CONFIG.mesons;
  const ss=Math.max(0.3,getSpeedScale());
  for(let i=0;i<nb;i++){
    const[x,y]=randPos();
    const h=new Hadron(x,y,3);
    h.vx=(Math.random()-0.5)*ss*1.4;
    h.vy=(Math.random()-0.5)*ss*1.4;
    freeHadrons.push(h);
  }
  for(let i=0;i<nm;i++){
    const[x,y]=randPos();
    const h=new Hadron(x,y,2);
    h.vx=(Math.random()-0.5)*ss*1.4;
    h.vy=(Math.random()-0.5)*ss*1.4;
    freeHadrons.push(h);
  }
  totalBaryonInit=nb;
}
init();

// ============================================================
//  Binding check with gamma/pion emission
// ============================================================
function checkBinding(){
  const baryons=freeHadrons.filter(h=>Math.abs(h.nq)===3);
  for(let i=0;i<baryons.length;i++)for(let j=i+1;j<baryons.length;j++){
    const a=baryons[i],b=baryons[j];
    const dx=a.x-b.x,dy=a.y-b.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<BIND_DIST){
      a.nearTime.set(b.id,(a.nearTime.get(b.id)||0)+1);
      b.nearTime.set(a.id,(b.nearTime.get(a.id)||0)+1);
    } else {
      a.nearTime.set(b.id,0);b.nearTime.set(a.id,0);
    }
  }
  const co=new Map();baryons.forEach(h=>co.set(h.id,h.id));
  function find(id){let r=id;while(co.get(r)!==r)r=co.get(r);return r;}
  function union(a,b){co.set(find(a),find(b));}
  for(let i=0;i<baryons.length;i++)for(let j=i+1;j<baryons.length;j++){
    const a=baryons[i],b=baryons[j];
    if((a.nearTime.get(b.id)||0)>=BIND_TIME)union(a.id,b.id);
  }
  const clusters=new Map();
  baryons.forEach(h=>{const r=find(h.id);if(!clusters.has(r))clusters.set(r,[]);clusters.get(r).push(h);});

  clusters.forEach(members=>{
    if(members.length<2)return;
    let internalKE=0;
    for(let i=0;i<members.length;i++)for(let j=i+1;j<members.length;j++)internalKE+=relKE(members[i],members[j]);
    const Ebind=bindingEnergy(members.length);
    if(internalKE>Ebind*6.0)return;

    const cx=members.reduce((s,h)=>s+h.x,0)/members.length;
    const cy=members.reduce((s,h)=>s+h.y,0)/members.length;
    const cmvx=members.reduce((s,h)=>s+h.vx,0)/members.length;
    const cmvy=members.reduce((s,h)=>s+h.vy,0)/members.length;

    const excessEnergy=Math.max(0,internalKE-Ebind*0.5);
    const cmVel={vx:cmvx,vy:cmvy};

    const internalVels=members.map(h=>({
      get rvx(){ return h.vx-cmVel.vx; },
      set rvx(v){ h.vx=cmVel.vx+v; },
      get rvy(){ return h.vy-cmVel.vy; },
      set rvy(v){ h.vy=cmVel.vy+v; },
    }));

    if(excessEnergy<0.5){
      const nGammas=excessEnergy<0.2?1:2;
      emitGammas(cx,cy,nGammas,excessEnergy,internalVels,cmVel);
    } else if(excessEnergy<1.5){
      if(Math.random()<0.5){
        emitGammas(cx,cy,2,excessEnergy,internalVels,cmVel);
      } else if(excessEnergy>M_PI_EFF){
        const kePI=excessEnergy-M_PI_EFF;
        const vPI=Math.sqrt(Math.max(0,2*kePI/M_M));
        const angle=Math.random()*Math.PI*2;
        emitPion(cx,cy,angle,vPI,cmVel,members,members.length);
        emitGammas(cx,cy,1,0.1,internalVels,cmVel);
      } else {
        emitGammas(cx,cy,2,excessEnergy,internalVels,cmVel);
      }
    } else {
      let E=excessEnergy;
      let nPI=0;
      while(E>M_PI_EFF&&nPI<3){
        const kePI=Math.min(E-M_PI_EFF, 0.8);
        const vPI=Math.sqrt(Math.max(0,2*kePI/M_M));
        const angle=Math.random()*Math.PI*2;
        emitPion(cx,cy,angle,vPI,cmVel,members,members.length);
        E-=(M_PI_EFF+kePI);
        nPI++;
      }
      if(E>0.1){ emitGammas(cx,cy,1,E,internalVels,cmVel); }
    }

    const targetKE=Ebind*0.4;
    const scaleFactor=internalKE>0?Math.sqrt(Math.min(targetKE/internalKE,1)):1;
    members.forEach(h=>{
      h.vx=cmVel.vx+(h.vx-cmVel.vx)*scaleFactor;
      h.vy=cmVel.vy+(h.vy-cmVel.vy)*scaleFactor;
    });

    const nuc=new Nucleus(members);nuclei.push(nuc);
    members.forEach(h=>{const idx=freeHadrons.indexOf(h);if(idx>=0)freeHadrons.splice(idx,1);});
    addSparks(cx,cy,4,false);
  });
}

// ============================================================
//  Nucleus collisions
// ============================================================
function nucleusCollisions(){
  for(let ni=nuclei.length-1;ni>=0;ni--){
    const nuc=nuclei[ni];
    for(let hi=freeHadrons.length-1;hi>=0;hi--){
      const h=freeHadrons[hi];
      if(h.escaped)continue;
      const dx=h.x-nuc.x,dy=h.y-nuc.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d>nuc.radius+R_H+5)continue;
      const rke=0.5*((h.vx-nuc.vx)**2+(h.vy-nuc.vy)**2)*nuc.nBaryons;
      if(rke<nuc.bindE*0.5){
        const nx=dx/d,ny=dy/d;
        const relV=(h.vx-nuc.vx)*nx+(h.vy-nuc.vy)*ny;
        if(relV<0){
          const mN=nuc.nBaryons,imp=2*relV/(mN+1);
          h.vx-=imp*mN*nx;h.vy-=imp*mN*ny;
          nuc.vx+=imp*nx;nuc.vy+=imp*ny;
        }
      } else if(rke<nuc.bindE*1.8&&Math.abs(h.nq)===3){
        nuc.members.push({nq:h.nq,rx:(Math.random()-0.5)*nuc.radius*0.4,ry:(Math.random()-0.5)*nuc.radius*0.4,rvx:(h.vx-nuc.vx)*0.3,rvy:(h.vy-nuc.vy)*0.3,quarks:h.quarks,id:h.id});
        nuc.vx=(nuc.vx*nuc.nBaryons+h.vx)/(nuc.nBaryons+1);
        nuc.vy=(nuc.vy*nuc.nBaryons+h.vy)/(nuc.nBaryons+1);
        nuc.nBaryons++;nuc.bindE=bindingEnergy(nuc.nBaryons);
        nuc.radius=R_H*(0.8+0.55*Math.pow(nuc.nBaryons,1/3));
        nuc.excitation=0.5;
        freeHadrons.splice(hi,1);addSparks(nuc.x,nuc.y,8,false);
        break;
      } else {
        const released=nuc.dissolve();
        released.forEach(r=>{r.vx+=(Math.random()-0.5)*1.0;r.vy+=(Math.random()-0.5)*1.0;});
        freeHadrons.push(...released);
        nuclei.splice(ni,1);
        addSparks(nuc.x,nuc.y,16,true);
        break;
      }
    }
  }
  for(let i=nuclei.length-1;i>=0;i--){
    for(let j=i-1;j>=0;j--){
      const na=nuclei[i],nb=nuclei[j];
      const dx=nb.x-na.x,dy=nb.y-na.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d>na.radius+nb.radius+5)continue;
      const rke=0.5*((na.vx-nb.vx)**2+(na.vy-nb.vy)**2)*(na.nBaryons+nb.nBaryons)*0.5;
      if(rke<(na.bindE+nb.bindE)*0.4){
        const nx=dx/d,ny=dy/d;
        const relV=(nb.vx-na.vx)*nx+(nb.vy-na.vy)*ny;
        if(relV<0){
          const imp=2*relV/(na.nBaryons+nb.nBaryons);
          na.vx-=imp*nb.nBaryons*nx;na.vy-=imp*nb.nBaryons*ny;
          nb.vx+=imp*na.nBaryons*nx;nb.vy+=imp*na.nBaryons*ny;
        }
      } else {
        const ra=na.dissolve(),rb=nb.dissolve();
        freeHadrons.push(...ra,...rb);
        addSparks((na.x+nb.x)/2,(na.y+nb.y)/2,20,true);
        nuclei.splice(i,1);nuclei.splice(j,1);
        i=Math.min(i,nuclei.length-1);break;
      }
    }
  }
}

// ============================================================
//  Forces
// ============================================================
function applyForces(){
  const active=freeHadrons.filter(h=>!h.escaped);
  active.forEach(h=>{h.bond=null;h.attract=null;});
  for(let i=0;i<active.length;i++){
    for(let j=i+1;j<active.length;j++){
      const ha=active[i],hb=active[j];
      const dx=hb.x-ha.x,dy=hb.y-ha.y,d=Math.sqrt(dx*dx+dy*dy)||0.1;
      const ux=dx/d,uy=dy/d;
      const BBbar=(ha.nq===3&&hb.nq===-3)||(ha.nq===-3&&hb.nq===3);
      const bothB=Math.abs(ha.nq)===3&&Math.abs(hb.nq)===3;
      let f=0;
      if(BBbar)f=bBbarForce(d);
      else if(bothB)f=bbForce(d);
      else if(Math.abs(ha.nq)===2||Math.abs(hb.nq)===2)
        f=(Math.abs(ha.nq)===3||Math.abs(hb.nq)===3)?bmForce(d):mmForce(d);
      ha.vx+=ux*f;ha.vy+=uy*f;hb.vx-=ux*f;hb.vy-=uy*f;
      if(bothB&&!BBbar&&f>0&&!ha.bond)ha.bond=hb.id;
    }
  }
  nuclei.forEach(nuc=>{
    active.forEach(h=>{
      const dx=h.x-nuc.x,dy=h.y-nuc.y,d=Math.sqrt(dx*dx+dy*dy)||0.1;
      if(d>250)return;
      const ux=dx/d,uy=dy/d;
      const f=Math.abs(h.nq)===3?bmForce(d)*nuc.nBaryons*0.3:bmForce(d)*nuc.nBaryons*0.15;
      h.vx+=ux*f;h.vy+=uy*f;
      nuc.vx-=ux*f/nuc.nBaryons;nuc.vy-=uy*f/nuc.nBaryons;
    });
  });
  const allB=active.filter(h=>Math.abs(h.nq)===3);
  applyPauli(allB);
}

// ============================================================
//  Meson absorption
// ============================================================
function tryAbsorption(){
  if(absorptionCooldown>0){absorptionCooldown--;return;}
  if(Math.random()>0.08)return;

  const baryons=freeHadrons.filter(h=>Math.abs(h.nq)===3&&!h.escaped);
  const mesons=freeHadrons.filter(h=>Math.abs(h.nq)===2&&!h.escaped);
  const shuffled=[...mesons].sort(()=>Math.random()-0.5);

  for(const m of shuffled){
    const near=baryons.filter(b=>Math.sqrt((b.x-m.x)**2+(b.y-m.y)**2)<ABSORPTION_RANGE);
    if(near.length<2)continue;
    const b1=near[0],b2=near[1];
    absorptionBTB(b1,b2,m);
    freeHadrons.splice(freeHadrons.indexOf(m),1);
    const mx=(b1.x+b2.x)/2,my=(b1.y+b2.y)/2;
    addSparks(mx,my,12,false);
    absorptionCooldown=25;
    return;
  }
}

// ============================================================
//  Two-body collisions
// ============================================================
function tryCollision(){
  if(interactCooldown>0){interactCooldown--;return;}
  let minD=Infinity,ia=-1,ib=-1;
  for(let i=0;i<freeHadrons.length;i++){
    if(freeHadrons[i].escaped)continue;
    for(let j=i+1;j<freeHadrons.length;j++){
      if(freeHadrons[j].escaped)continue;
      const dx=freeHadrons[i].x-freeHadrons[j].x,dy=freeHadrons[i].y-freeHadrons[j].y;
      const d=Math.sqrt(dx*dx+dy*dy);
      if(d<minD){minD=d;ia=i;ib=j;}
    }
  }
  if(ia<0||minD>R_H*1.9)return;

  const ha=freeHadrons[ia],hb=freeHadrons[ib];
  const rke=relKE(ha,hb);
  const mx=(ha.x+hb.x)/2,my=(ha.y+hb.y)/2;
  const cmvx=(ha.vx+hb.vx)*0.5,cmvy=(ha.vy+hb.vy)*0.5;
  const bnBefore=baryonNum(ha.nq)+baryonNum(hb.nq);
  addSparks(mx,my,rke>KE_MULTI?18:8,rke>KE_MULTI);
  const newH=[];

  if((ha.nq===3&&hb.nq===-3)||(ha.nq===-3&&hb.nq===3)){
    addSparks(mx,my,16,true);
    if(Math.random()<0.5){
      const totalE=2.0+rke;
      const angle=Math.random()*Math.PI*2;
      const cmVelAnn={vx:cmvx,vy:cmvy};
      emitGammas(mx,my,1,totalE*0.5,null,cmVelAnn);
      const g2angle=angle+Math.PI;
      gammas.push({
        ox:mx,oy:my,angle:g2angle,dist:0,
        speed:6.0+Math.random()*2.0,
        wavelength:8+Math.random()*4,
        amplitude:2.5+Math.min(totalE*2.0,4.0),
        life:1.0,decay:0.015,energy:totalE*0.5,
      });
    } else {
      const nm=Math.max(2,2+Math.floor(rke*1.5));
      for(let i=0;i<nm;i++){
        const a=(i/nm)*Math.PI*2;
        const spd=Math.sqrt(Math.max(0,(2.0+rke)/nm/M_M));
        const h=new Hadron(mx+Math.cos(a)*24,my+Math.sin(a)*24,2);
        h.vx=cmvx+Math.cos(a)*spd;h.vy=cmvy+Math.sin(a)*spd;
        newH.push(h);
      }
    }
  } else if(ha.nq===3&&hb.nq===3){
    if(rke>=KE_MULTI){
      const np=nPairsFromKE(rke);
      const formed=formHadrons(mx,my,6+np,np,cmvx,cmvy);
      newH.push(...formed);
    } else if(rke>=KE_INELASTIC){
      [new Hadron(mx-22,my,3),new Hadron(mx+22,my,3),new Hadron(mx,my-20,2),new Hadron(mx,my+20,2)].forEach(h=>{
        const a=Math.atan2(h.y-my,h.x-mx);h.vx=cmvx+Math.cos(a)*0.7;h.vy=cmvy+Math.sin(a)*0.7;newH.push(h);
      });
    } else {
      [new Hadron(mx-22,my,3),new Hadron(mx+22,my,3)].forEach(h=>{
        const a=Math.atan2(h.y-my,h.x-mx);h.vx=cmvx+Math.cos(a)*0.8;h.vy=cmvy+Math.sin(a)*0.8;newH.push(h);
      });
    }
  } else if(ha.nq===-3&&hb.nq===-3){
    [new Hadron(mx-22,my,-3),new Hadron(mx+22,my,-3)].forEach(h=>{
      const a=Math.atan2(h.y-my,h.x-mx);h.vx=cmvx+Math.cos(a)*0.8;h.vy=cmvy+Math.sin(a)*0.8;newH.push(h);
    });
  } else if((Math.abs(ha.nq)===3&&Math.abs(hb.nq)===2)||(Math.abs(ha.nq)===2&&Math.abs(hb.nq)===3)){
    const bNq=Math.abs(ha.nq)===3?ha.nq:hb.nq;
    if(rke>=KE_INELASTIC){
      const nm=1+Math.floor(rke*0.8);
      const hOut=new Hadron(mx-20,my,bNq);hOut.vx=cmvx-0.5;hOut.vy=cmvy;newH.push(hOut);
      for(let i=0;i<nm;i++){
        const a=Math.random()*Math.PI*2;
        const hm=new Hadron(mx+Math.cos(a)*22,my+Math.sin(a)*22,2);
        hm.vx=cmvx+Math.cos(a)*0.9;hm.vy=cmvy+Math.sin(a)*0.9;newH.push(hm);
      }
    } else {
      [new Hadron(mx-20,my,bNq),new Hadron(mx+20,my,2)].forEach(h=>{
        const a=Math.atan2(h.y-my,h.x-mx);h.vx=cmvx+Math.cos(a)*0.8;h.vy=cmvy+Math.sin(a)*0.8;newH.push(h);
      });
    }
  } else {
    [new Hadron(mx-18,my,2),new Hadron(mx+18,my,2)].forEach(h=>{
      const a=Math.atan2(h.y-my,h.x-mx);h.vx=cmvx+Math.cos(a)*0.8;h.vy=cmvy+Math.sin(a)*0.8;newH.push(h);
    });
  }

  ensureBaryonNumber(newH,bnBefore);
  freeHadrons.splice(Math.max(ia,ib),1);freeHadrons.splice(Math.min(ia,ib),1);
  freeHadrons.push(...newH);
  interactCooldown=45;
}

// ============================================================
//  Baryon number check
// ============================================================
function countAllBaryons(){
  const free=freeHadrons.reduce((s,h)=>s+baryonNum(h.nq),0);
  const bound=nuclei.reduce((s,n)=>s+n.members.reduce((ss,m)=>ss+baryonNum(m.nq),0),0);
  return free+bound;
}

function globalBaryonCheck(){
  const current=countAllBaryons();
  const diff=totalBaryonInit-current;
  if(diff===0)return;
  for(let i=0;i<Math.abs(diff);i++){
    const[x,y]=randPos();
    freeHadrons.push(new Hadron(x,y,diff>0?3:-3));
  }
}

// ============================================================
//  Draw helpers
// ============================================================
function drawLine(ha,hb,dash,a,w){
  ctx.save();ctx.setLineDash(dash);ctx.beginPath();
  ctx.moveTo(ha.x,ha.y);ctx.lineTo(hb.x,hb.y);
  ctx.strokeStyle=fg(a);ctx.lineWidth=w;ctx.stroke();
  ctx.setLineDash([]);ctx.restore();
}

// ============================================================
//  Main loop
// ============================================================
function loop(){
  animationFrame=null;
  const ss=getSpeedScale();
  ctx.clearRect(0,0,W,H);

  if(ss>0.01){
    applyForces();
    freeHadrons.forEach(h=>h.move());
    freeHadrons=freeHadrons.filter(h=>!h.dead);
    nuclei.forEach(n=>n.move());
    if(frame%8===0){
      checkBinding();
      nucleusCollisions();
      tryAbsorption();
      tryCollision();
    }
    if(frame%60===0) globalBaryonCheck();
  }
  frame++;

  // Draw bonds
  const drawnB=new Set();
  freeHadrons.forEach((ha,i)=>{
    if(ha.bond){
      const j=freeHadrons.findIndex(h=>h.id===ha.bond);
      if(j>=0){
        const key=[Math.min(i,j),Math.max(i,j)].join('-');
        if(!drawnB.has(key)){
          drawnB.add(key);
          const hb=freeHadrons[j],d=Math.sqrt((hb.x-ha.x)**2+(hb.y-ha.y)**2);
          const f=bbForce(d);
          drawLine(ha,hb,f>0?[4,5]:[2,3],Math.min(0.24,Math.abs(f)*9),f>0?0.9:0.6);
        }
      }
    }
  });

  // Sparks
  sparks=sparks.filter(s=>s.life>0);
  sparks.forEach(s=>{
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=fg(s.life*0.62);ctx.fill();
    s.x+=s.vx;s.y+=s.vy;s.vx*=0.93;s.vy*=0.93;s.life-=0.020;
  });

  // Gamma rays
  gammas=gammas.filter(g=>g.life>0);
  gammas.forEach(g=>{
    const px=Math.cos(g.angle),py=Math.sin(g.angle);
    const nx=-py,ny=px;
    ctx.beginPath();
    const steps=Math.ceil(g.dist/2);
    for(let s=0;s<=steps;s++){
      const t=(s/steps)*g.dist;
      const wave=g.amplitude*Math.sin((t/g.wavelength)*Math.PI*2);
      const wx=g.ox+px*t+nx*wave;
      const wy=g.oy+py*t+ny*wave;
      if(s===0)ctx.moveTo(wx,wy);else ctx.lineTo(wx,wy);
    }
    ctx.strokeStyle=fg(g.life*0.55);
    ctx.lineWidth=0.8;
    ctx.stroke();

    const tipWave=g.amplitude*Math.sin((g.dist/g.wavelength)*Math.PI*2);
    const tipX=g.ox+px*g.dist+nx*tipWave;
    const tipY=g.oy+py*g.dist+ny*tipWave;
    ctx.beginPath();ctx.arc(tipX,tipY,1.2,0,Math.PI*2);
    ctx.fillStyle=fg(g.life*0.7);ctx.fill();

    g.dist+=g.speed;
    g.life-=g.decay;
    if(tipX<0||tipX>W||tipY<0||tipY>H)g.life=0;
  });

  // Draw hadrons
  const alpha=ss<0.02?0.4:Math.min(1,ss*0.6+0.35);
  nuclei.forEach(n=>n.draw(alpha));
  freeHadrons.forEach(h=>{
    if(h.escaped){
      const alpha_esc=0.30;
      ctx.beginPath();ctx.arc(h.x,h.y,R_H,0,Math.PI*2);
      ctx.setLineDash([3,3]);
      ctx.strokeStyle=fg(alpha_esc*0.7);ctx.lineWidth=0.7;ctx.stroke();
      ctx.setLineDash([]);
      if(h.quarks&&h.quarks.length>=2){
        ctx.beginPath();
        ctx.moveTo(h.x+h.quarks[0].lx,h.y+h.quarks[0].ly);
        ctx.lineTo(h.x+h.quarks[1].lx,h.y+h.quarks[1].ly);
        ctx.strokeStyle=fg(alpha_esc*0.5);ctx.lineWidth=0.5;ctx.stroke();
        ctx.beginPath();ctx.arc(h.x+h.quarks[0].lx,h.y+h.quarks[0].ly,R_Q,0,Math.PI*2);
        ctx.fillStyle=fg(alpha_esc*0.85);ctx.fill();
        ctx.beginPath();ctx.arc(h.x+h.quarks[1].lx,h.y+h.quarks[1].ly,R_Q,0,Math.PI*2);
        ctx.strokeStyle=fg(alpha_esc*0.75);ctx.lineWidth=0.8;ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(h.x,h.y);
      ctx.lineTo(h.x-h.vx*4,h.y-h.vy*4);
      ctx.strokeStyle=fg(0.10);ctx.lineWidth=0.5;ctx.stroke();
    } else {
      h.draw(alpha);
    }
  });

  scheduleLoop();
}

function scheduleLoop(){
  if(animationFrame!==null||motionPreference.matches||document.hidden||CONFIG.speed<=0.01)return;
  animationFrame=requestAnimationFrame(loop);
}

function renderNextFrame(){
  if(animationFrame===null)animationFrame=requestAnimationFrame(loop);
}

// Listen for config from the same-origin parent only.
window.addEventListener('message', function(e) {
  if(e.origin!==window.location.origin||e.source!==window.parent)return;
  if (e.data && e.data.type === 'hadron-config') {
    if (typeof e.data.speed === 'number') CONFIG.speed = e.data.speed;
    if (typeof e.data.baryons === 'number') CONFIG.baryons = Math.max(1,Math.min(12,Math.round(e.data.baryons)));
    if (typeof e.data.mesons === 'number') CONFIG.mesons = Math.max(0,Math.min(8,Math.round(e.data.mesons)));
    if (e.data.reset) init();
    renderNextFrame();
  }
});

document.addEventListener('visibilitychange', function(){
  if(document.hidden&&animationFrame!==null){cancelAnimationFrame(animationFrame);animationFrame=null;}
  else if(!document.hidden)renderNextFrame();
});

motionPreference.addEventListener('change', function(){
  if(motionPreference.matches&&animationFrame!==null){cancelAnimationFrame(animationFrame);animationFrame=null;}
  renderNextFrame();
});

loop();
</script>
</body>
</html>
