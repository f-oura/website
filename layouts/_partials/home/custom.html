<!-- Abstract particle trajectory graphic -->
<div class="particle-graphic" aria-hidden="true">
  <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <!-- Orbital paths inspired by sub-atomic particle trajectories -->
    <g class="orbital-group">
      <!-- Main orbital loops -->
      <path class="orbital orbital-1" d="M200,80
        Q280,80 320,140
        Q360,200 320,260
        Q280,320 200,320
        Q120,320 80,260
        Q40,200 80,140
        Q120,80 200,80
        M200,120
        Q160,120 140,160
        Q120,200 140,240
        Q160,280 200,280
        Q240,280 260,240
        Q280,200 260,160
        Q240,120 200,120" />

      <!-- Spiral trajectory -->
      <path class="orbital orbital-2" d="M200,160
        C220,140 260,140 280,160
        C300,180 300,220 280,240
        C260,260 220,260 200,240
        C180,220 180,180 200,160
        M180,180
        C190,170 210,170 220,180
        C230,190 230,210 220,220
        C210,230 190,230 180,220
        C170,210 170,190 180,180" />

      <!-- Asymmetric loop -->
      <path class="orbital orbital-3" d="M120,200
        Q120,120 200,100
        Q280,80 320,160
        Q360,240 300,300
        Q240,360 160,320
        Q80,280 120,200
        M160,200
        Q160,160 200,140
        Q240,120 270,160
        Q300,200 270,250
        Q240,300 180,270
        Q120,240 160,200" />

      <!-- Figure-eight pattern -->
      <path class="orbital orbital-4" d="M200,200
        C240,160 300,160 320,200
        C340,240 300,280 260,280
        C220,280 200,240 200,200
        C200,160 180,120 140,120
        C100,120 60,160 80,200
        C100,240 140,280 180,280
        C220,280 240,240 200,200" />

      <!-- Small inner loops -->
      <path class="orbital orbital-5" d="M180,200
        Q180,180 200,180
        Q220,180 220,200
        Q220,220 200,220
        Q180,220 180,200
        M170,190
        Q170,170 190,170
        Q210,170 210,190
        Q210,210 190,210
        Q170,210 170,190
        M230,190
        Q230,170 250,170
        Q270,170 270,190
        Q270,210 250,210
        Q230,210 230,190" />

      <!-- Curved connecting paths -->
      <path class="orbital orbital-6" d="M100,150
        Q150,100 200,120
        Q250,140 280,100
        M120,280
        Q180,320 240,280
        Q300,240 340,260" />

      <!-- Additional swirling paths -->
      <path class="orbital orbital-7" d="M140,140
        C160,100 240,100 260,140
        C280,180 280,220 260,260
        C240,300 160,300 140,260
        C120,220 120,180 140,140
        M150,160
        C170,130 230,130 250,160
        C270,190 270,210 250,240
        C230,270 170,270 150,240
        C130,210 130,190 150,160" />
    </g>
  </svg>
</div>

<style>
  .particle-graphic {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 55vmin;
    height: 55vmin;
    pointer-events: none;
    z-index: 0;
    opacity: 0.5;
  }

  .particle-graphic svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .orbital {
    fill: none;
    stroke: #ffffff;
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .orbital-1 { stroke-width: 1.4; opacity: 0.9; }
  .orbital-2 { stroke-width: 1.0; opacity: 0.8; }
  .orbital-3 { stroke-width: 1.3; opacity: 0.85; }
  .orbital-4 { stroke-width: 1.1; opacity: 0.75; }
  .orbital-5 { stroke-width: 1.5; opacity: 0.95; }
  .orbital-6 { stroke-width: 0.8; opacity: 0.6; }
  .orbital-7 { stroke-width: 1.2; opacity: 0.8; }

  .dark .orbital {
    stroke: rgba(255, 255, 255, 0.7);
  }

  /* Subtle rotation animation */
  .orbital-group {
    transform-origin: center;
    animation: slowRotate 120s linear infinite;
  }

  @keyframes slowRotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  /* Make content readable over graphic */
  main {
    position: relative;
    z-index: 1;
  }

  header, footer {
    position: relative;
    z-index: 2;
  }

  /* Responsive sizing */
  @media (max-width: 768px) {
    .particle-graphic {
      width: 80vmin;
      height: 80vmin;
      opacity: 0.35;
    }
  }

  @media (max-width: 480px) {
    .particle-graphic {
      width: 100vmin;
      height: 100vmin;
      opacity: 0.25;
    }
  }
</style>
