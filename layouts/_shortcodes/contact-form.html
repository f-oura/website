{{- $ja := eq .Page.Language.Lang "ja" -}}
{{- $to := "ohura.fumiya@jaea.go.jp" -}}
<form class="contact-form" data-contact-form data-contact-to="{{ $to }}">
  <div class="contact-form__row">
    <label for="contact-name">{{ if $ja }}お名前{{ else }}Name{{ end }}</label>
    <input id="contact-name" name="name" type="text" autocomplete="name" required>
  </div>
  <div class="contact-form__row">
    <label for="contact-email">{{ if $ja }}返信用メール{{ else }}Your email{{ end }}</label>
    <input id="contact-email" name="email" type="email" autocomplete="email" required>
  </div>
  <div class="contact-form__row">
    <label for="contact-subject">{{ if $ja }}件名{{ else }}Subject{{ end }}</label>
    <input
      id="contact-subject"
      name="subject"
      type="text"
      maxlength="120"
      value="{{ if $ja }}ウェブサイトからの問い合わせ{{ else }}Inquiry from the website{{ end }}"
    >
  </div>
  <div class="contact-form__row">
    <label for="contact-message">{{ if $ja }}本文{{ else }}Message{{ end }}</label>
    <textarea id="contact-message" name="message" rows="6" required></textarea>
  </div>
  <p class="contact-form__note">
    {{- if $ja -}}
      送信先は {{ $to }} です。外部のフォームサービスは使いません。
    {{- else -}}
      Messages go to {{ $to }}. This form does not use a third-party form service.
    {{- end -}}
  </p>
  <button class="button button--primary" type="submit">{{ if $ja }}メールを作成する{{ else }}Compose email{{ end }}</button>
  <p class="contact-form__status" data-contact-status role="status" hidden></p>
</form>
