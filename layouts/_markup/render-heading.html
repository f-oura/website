<h{{ .Level }} id="{{ .Anchor | safeURL }}">
  {{- .Text | safeHTML -}}
  {{- if .Page.Params.showHeadingAnchors | default (.Page.Site.Params.article.showHeadingAnchors | default true) -}}
    <a class="heading-anchor" href="#{{ .Anchor | safeURL }}" aria-label="{{ i18n "article.anchor_label" }}"><span aria-hidden="true">#</span></a>
  {{- end -}}
</h{{ .Level }}>
