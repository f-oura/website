
<style>
  @media (prefers-color-scheme: dark) {
    :root{--bg:#0e0e0e;--fg:rgba(255,255,255,0.82);--fg2:rgba(255,255,255,0.32);--fg3:rgba(255,255,255,0.08);}
  }
  @media (prefers-color-scheme: light) {
    :root{--bg:#f8f7f4;--fg:rgba(0,0,0,0.80);--fg2:rgba(0,0,0,0.35);--fg3:rgba(0,0,0,0.08);}
  }
  .wrap{position:relative;width:100%;overflow:hidden;background:var(--bg);border-radius:12px;}
  canvas{display:block;width:100%;}
  .controls{display:flex;flex-wrap:wrap;gap:10px 18px;padding:10px 16px;border-top:0.5px solid var(--fg3);align-items:center;}
  .ctrl-group{display:flex;align-items:center;gap:7px;}
  .ctrl-label{font-size:12px;color:var(--fg2);white-space:nowrap;}
  .ctrl-val{font-size:12px;color:var(--fg);min-width:16px;text-align:right;}
  input[type=range]{width:76px;}
  button{font-size:11px;padding:4px 10px;border-radius:6px;border:0.5px solid var(--fg2);background:transparent;color:var(--fg2);cursor:pointer;}
  button:hover{background:var(--fg3);}
  .status{font-size:11px;color:var(--fg2);padding:4px 16px 8px;min-height:15px;}
</style>

<div class="wrap" id="wrap">
  <canvas id="cv"></canvas>
  <div class="controls">
    <div class="ctrl-group">
      <span class="ctrl-label">Baryons</span>
      <input type="range" id="slB" min="1" max="12" value="7" step="1">
      <span class="ctrl-val" id="valB">7</span>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Mesons</span>
      <input type="range" id="slM" min="0" max="8" value="3" step="1">
      <span class="ctrl-val" id="valM">3</span>
    </div>
    <div class="ctrl-group">
      <span class="ctrl-label">Speed</span>
      <input type="range" id="slS" min="0" max="100" value="40" step="1">
    </div>
    <button id="btnReset">Reset</button>
  </div>
  <div class="status" id="statusEl"></div>
</div>

<script>
const wrap=document.getElementById('wrap'),cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const slB=document.getElementById('slB'),slM=document.getElementById('slM'),slS=document.getElementById('slS');
const valB=document.getElementById('valB'),valM=document.getElementById('valM'),statusEl=document.getElementById('statusEl');

let W,H;
function resize(){W=cv.width=wrap.offsetWidth;H=cv.height=Math.round(W*0.62);cv.style.height=H+'px';}
resize();window.addEventListener('resize',resize);

const isDark=()=>window.matchMedia('(prefers-color-scheme:dark)').matches;
const fg=a=>isDark()?`rgba(255,255,255,${a})`:`rgba(0,0,0,${a})`;

const R_Q=3.0,R_H=22;

function baryonNum(nq){return nq===3?1:nq===-3?-1:0;}
function relKE(ha,hb){const dvx=ha.vx-hb.vx,dvy=ha.vy-hb.vy;return 0.5*(dvx*dvx+dvy*dvy);}
const KE_INELASTIC=0.8,KE_MULTI=2.0;
function nPairsFromKE(rke){return Math.min(4,1+Math.floor((rke-KE_INELASTIC)/0.8));}

function bbForce(d){
  const rep=R_H*1.9,eq=R_H*2.8;
  if(d<rep)return -(0.07*(rep-d)/rep);
  if(d<190)return 0.017*Math.exp(-(d-eq)*(d-eq)/(2*40*40));
  return 0;
}
function bmForce(d){return d<200?0.019*(1-d/200):0;}
function mmForce(d){return d<120?-0.004*(1-d/120):0;}
function bBbarForce(d){return d<220?0.030*(1-d/220):0;}

const D_POS=R_H*2.8,D_MOM=0.55,PAULI_MAX=4,PAULI_STR=0.055;
function pauliCell(h){return{px:Math.round(h.x/D_POS),py:Math.round(h.y/D_POS),mx:Math.round(h.vx/D_MOM),my:Math.round(h.vy/D_MOM)};}
function applyPauli(baryons){
  const cells=new Map();
  baryons.forEach(h=>{const c=pauliCell(h),k=`${c.px},${c.py},${c.mx},${c.my}`;if(!cells.has(k))cells.set(k,[]);cells.get(k).push(h);});
  cells.forEach(members=>{
    if(members.length<=PAULI_MAX)return;
    for(let i=0;i<members.length;i++)for(let j=i+1;j<members.length;j++){
      const a=members[i],b=members[j];
      const dvx=a.vx-b.vx,dvy=a.vy-b.vy,dp=Math.sqrt(dvx*dvx+dvy*dvy)+0.001;
      if(dp<D_MOM*2){
        const kick=PAULI_STR*(1-dp/(D_MOM*2)),nx=dvy/dp,ny=-dvx/dp;
        a.vx+=nx*kick;a.vy+=ny*kick;b.vx-=nx*kick;b.vy-=ny*kick;
      }
    }
  });
}

function detectClusters(hadrons){
  const baryons=hadrons.filter(h=>Math.abs(h.nq)===3);
  const co=new Map();baryons.forEach(h=>co.set(h.id,h.id));
  function find(id){let r=id;while(co.get(r)!==r)r=co.get(r);return r;}
  function union(a,b){co.set(find(a),find(b));}
  for(let i=0;i<baryons.length;i++)for(let j=i+1;j<baryons.length;j++){
    const dx=baryons[i].x-baryons[j].x,dy=baryons[i].y-baryons[j].y;
    if(Math.sqrt(dx*dx+dy*dy)<D_POS*1.2)union(baryons[i].id,baryons[j].id);
  }
  const cl=new Map();
  baryons.forEach(h=>{const r=find(h.id);if(!cl.has(r))cl.set(r,[]);cl.get(r).push(h);});
  return cl;
}

let idC=0;function uid(){return++idC;}

class Hadron{
  constructor(x,y,nq){
    this.id=uid();this.nq=nq;
    this.x=x;this.y=y;
    this.vx=(Math.random()-0.5)*0.7;this.vy=(Math.random()-0.5)*0.7;
    this.quarks=Array.from({length:Math.abs(nq)},(_,i)=>{
      const a=(i/Math.abs(nq))*Math.PI*2+Math.random()*0.4;
      return{lx:Math.cos(a)*9,ly:Math.sin(a)*9,vlx:(Math.random()-0.5)*0.3,vly:(Math.random()-0.5)*0.3};
    });
    this.pauliKick=0;this.bond=null;this.attract=null;
  }
  updateQuarks(){
    const eq=R_H*0.36;
    this.quarks.forEach(q=>{
      const dist=Math.sqrt(q.lx*q.lx+q.ly*q.ly)||0.1;
      const f=(dist-eq)*0.018;
      q.vlx-=(q.lx/dist)*f;q.vly-=(q.ly/dist)*f;
      this.quarks.forEach(o=>{
        if(o===q)return;
        const dx=q.lx-o.lx,dy=q.ly-o.ly,d=Math.sqrt(dx*dx+dy*dy)+0.1;
        if(d<15){q.vlx+=dx/d*0.06;q.vly+=dy/d*0.06;}
      });
      q.vlx*=0.97;q.vly*=0.97;q.lx+=q.vlx;q.ly+=q.vly;
    });
  }
  move(){
    this.x+=this.vx;this.y+=this.vy;
    const m=R_H+8;
    if(this.x<m){this.x=m;this.vx=Math.abs(this.vx);}
    if(this.x>W-m){this.x=W-m;this.vx=-Math.abs(this.vx);}
    if(this.y<m){this.y=m;this.vy=Math.abs(this.vy);}
    if(this.y>H-m){this.y=H-m;this.vy=-Math.abs(this.vy);}
    this.vx*=0.999;this.vy*=0.999;
    if(this.pauliKick>0)this.pauliKick-=0.05;
    this.updateQuarks();
  }
  draw(alpha){
    const isAnti=this.nq<0;
    const pk=Math.max(0,this.pauliKick);
    if(pk>0.1&&Math.abs(this.nq)===3){
      ctx.beginPath();ctx.arc(this.x,this.y,R_H+pk*4,0,Math.PI*2);
      ctx.strokeStyle=fg(pk*0.30);ctx.lineWidth=0.8;ctx.stroke();
    }
    ctx.beginPath();ctx.arc(this.x,this.y,R_H,0,Math.PI*2);
    if(isAnti)ctx.setLineDash([3,3]);
    ctx.strokeStyle=fg(alpha*(isAnti?0.22:0.11));
    ctx.lineWidth=isAnti?1.0:0.7;ctx.stroke();ctx.setLineDash([]);
    for(let i=0;i<this.quarks.length;i++){
      const qi=this.quarks[i],qj=this.quarks[(i+1)%this.quarks.length];
      ctx.beginPath();ctx.moveTo(this.x+qi.lx,this.y+qi.ly);ctx.lineTo(this.x+qj.lx,this.y+qj.ly);
      ctx.strokeStyle=fg(alpha*0.17);ctx.lineWidth=0.6;ctx.stroke();
    }
    if(Math.abs(this.nq)===3){
      const cx2=this.quarks.reduce((s,q)=>s+q.lx,0)/3,cy2=this.quarks.reduce((s,q)=>s+q.ly,0)/3;
      this.quarks.forEach(q=>{
        ctx.beginPath();ctx.moveTo(this.x+cx2,this.y+cy2);ctx.lineTo(this.x+q.lx,this.y+q.ly);
        ctx.strokeStyle=fg(alpha*0.12);ctx.lineWidth=0.5;ctx.stroke();
      });
    }
    this.quarks.forEach((q,i)=>{
      ctx.beginPath();ctx.arc(this.x+q.lx,this.y+q.ly,R_Q,0,Math.PI*2);
      if(isAnti){ctx.strokeStyle=fg(alpha*0.80);ctx.lineWidth=1.0;ctx.stroke();}
      else if(Math.abs(this.nq)===3){ctx.fillStyle=fg(alpha*0.88);ctx.fill();}
      else{if(i===0){ctx.fillStyle=fg(alpha*0.88);ctx.fill();}else{ctx.strokeStyle=fg(alpha*0.78);ctx.lineWidth=0.9;ctx.stroke();}}
    });
    const label=isAnti?(Math.abs(this.nq)===3?'B̄':'M̄'):(this.nq===3?'B':'M');
    ctx.fillStyle=fg(alpha*(isAnti?0.32:0.20));ctx.font='10px sans-serif';ctx.textAlign='center';
    ctx.fillText(label,this.x,this.y+R_H+11);
  }
}

function formHadrons(mx,my,nQ,nQbar,cmvx,cmvy){
  const newH=[];
  let q=nQ,qb=nQbar;
  while(q>=3){const a=Math.random()*Math.PI*2,r=18+Math.random()*28;newH.push(new Hadron(mx+Math.cos(a)*r,my+Math.sin(a)*r,3));q-=3;}
  while(qb>=3){const a=Math.random()*Math.PI*2,r=18+Math.random()*28;newH.push(new Hadron(mx+Math.cos(a)*r,my+Math.sin(a)*r,-3));qb-=3;}
  const mesons=Math.floor((q+qb)/2);
  for(let i=0;i<mesons;i++){const a=Math.random()*Math.PI*2,r=14+Math.random()*32;newH.push(new Hadron(mx+Math.cos(a)*r,my+Math.sin(a)*r,2));}
  const speed=Math.sqrt(cmvx*cmvx+cmvy*cmvy);
  const outSpd=Math.max(0.4,speed*0.7/Math.max(1,newH.length));
  newH.forEach(h=>{const a=Math.atan2(h.y-my,h.x-mx);h.vx=cmvx*0.3+Math.cos(a)*outSpd;h.vy=cmvy*0.3+Math.sin(a)*outSpd;});
  return newH;
}

function ensureBaryonNumber(newH,bnTarget){
  let bn=newH.reduce((s,h)=>s+baryonNum(h.nq),0);
  while(bn<bnTarget){newH.push(new Hadron(newH[0]?newH[0].x+30:W/2,newH[0]?newH[0].y:H/2,3));bn++;}
  while(bn>bnTarget){newH.push(new Hadron(newH[0]?newH[0].x-30:W/2,newH[0]?newH[0].y:H/2,-3));bn--;}
}

function drawLine(ha,hb,dash,a,w){
  ctx.save();ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(ha.x,ha.y);ctx.lineTo(hb.x,hb.y);
  ctx.strokeStyle=fg(a);ctx.lineWidth=w;ctx.stroke();ctx.setLineDash([]);ctx.restore();
}

let hadrons=[],sparks=[];
let frame=0,interactCooldown=0,absorptionCooldown=0,statusText='',statusTimer=0,pauliEventTimer=0;

function addSparks(x,y,n,big){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,spd=(big?1.2:0.5)+Math.random()*(big?3.0:1.8);
    sparks.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,life:1,r:big?1.8+Math.random()*2.5:0.8+Math.random()*1.2});
  }
}
function randPos(){return[R_H+16+Math.random()*(W-R_H*2-32),R_H+16+Math.random()*(H-R_H*2-32)];}
function setStatus(t){statusText=t;statusTimer=280;}

function init(){
  hadrons=[];sparks=[];
  const nb=parseInt(slB.value),nm=parseInt(slM.value);
  for(let i=0;i<nb;i++){const[x,y]=randPos();hadrons.push(new Hadron(x,y,3));}
  for(let i=0;i<nm;i++){const[x,y]=randPos();hadrons.push(new Hadron(x,y,2));}
}
init();

// --- 吸収反応専用の探索 ---
// 変更点1: RANGE を R_H*5.0 に拡大
// 変更点2: absorptionCooldown を 2-body と独立に管理
const ABSORPTION_RANGE=R_H*5.0;  // 旧: R_H*3.5

function findAbsorptionTriplet(){
  const baryons=hadrons.filter(h=>Math.abs(h.nq)===3);
  const mesons=hadrons.filter(h=>Math.abs(h.nq)===2);
  // シャッフルしてランダムなメソンから試みる（特定メソンへの偏りを防ぐ）
  const shuffled=[...mesons].sort(()=>Math.random()-0.5);
  for(const m of shuffled){
    const near=baryons.filter(b=>{
      const dx=b.x-m.x,dy=b.y-m.y;
      return Math.sqrt(dx*dx+dy*dy)<ABSORPTION_RANGE;
    });
    if(near.length>=2)return{b1:near[0],b2:near[1],m};
  }
  return null;
}

function applyForces(){
  hadrons.forEach(h=>{h.bond=null;h.attract=null;});
  for(let i=0;i<hadrons.length;i++){
    for(let j=i+1;j<hadrons.length;j++){
      const ha=hadrons[i],hb=hadrons[j];
      const dx=hb.x-ha.x,dy=hb.y-ha.y,d=Math.sqrt(dx*dx+dy*dy)||0.1;
      const ux=dx/d,uy=dy/d;
      const BBbar=(ha.nq===3&&hb.nq===-3)||(ha.nq===-3&&hb.nq===3);
      const bothB=Math.abs(ha.nq)===3&&Math.abs(hb.nq)===3;
      let f=0;
      if(BBbar)f=bBbarForce(d);
      else if(bothB)f=bbForce(d);
      else if(Math.abs(ha.nq)===2||Math.abs(hb.nq)===2){
        f=(Math.abs(ha.nq)===3||Math.abs(hb.nq)===3)?bmForce(d):mmForce(d);
      }
      ha.vx+=ux*f;ha.vy+=uy*f;hb.vx-=ux*f;hb.vy-=uy*f;
      if(bothB&&!BBbar&&f>0&&!ha.bond)ha.bond=hb.id;
      const hasBM=(Math.abs(ha.nq)===2||Math.abs(hb.nq)===2)&&(Math.abs(ha.nq)===3||Math.abs(hb.nq)===3);
      if(hasBM&&f>0.002){if(!ha.attract)ha.attract=hb.id;if(!hb.attract)hb.attract=ha.id;}
    }
  }
  const allB=hadrons.filter(h=>Math.abs(h.nq)===3);
  const prevV=new Map(allB.map(h=>[h.id,{vx:h.vx,vy:h.vy}]));
  applyPauli(allB);
  allB.forEach(h=>{
    const pv=prevV.get(h.id);
    const kick=Math.sqrt((h.vx-pv.vx)**2+(h.vy-pv.vy)**2);
    if(kick>0.03){h.pauliKick=Math.min(1,kick*3);pauliEventTimer=60;}
  });
}

function tryAbsorption(){
  // 変更点3: 確率を 0.012 → 0.08 に引き上げ、独立クールダウン
  if(absorptionCooldown>0){absorptionCooldown--;return false;}
  if(Math.random()>0.08)return false;
  const triplet=findAbsorptionTriplet();
  if(!triplet)return false;
  const{b1,b2,m}=triplet;
  const mx=(b1.x+b2.x)/2,my=(b1.y+b2.y)/2;
  addSparks(m.x,m.y,10,false);
  // メソンの運動量をバリオン2つに分配
  b1.vx+=m.vx*0.4;b1.vy+=m.vy*0.4;
  b2.vx+=m.vx*0.4;b2.vy+=m.vy*0.4;
  hadrons.splice(hadrons.indexOf(m),1);
  setStatus('B + B + M → B + B  (meson absorption)');
  absorptionCooldown=25;  // 2体衝突とは独立した短いクールダウン
  return true;
}

function tryCollision(){
  if(interactCooldown>0){interactCooldown--;return;}
  let minD=Infinity,ia=-1,ib=-1;
  for(let i=0;i<hadrons.length;i++)for(let j=i+1;j<hadrons.length;j++){
    const dx=hadrons[i].x-hadrons[j].x,dy=hadrons[i].y-hadrons[j].y;
    const d=Math.sqrt(dx*dx+dy*dy);
    if(d<minD){minD=d;ia=i;ib=j;}
  }
  if(ia<0||minD>R_H*1.9)return;
  const ha=hadrons[ia],hb=hadrons[ib];
  const rke=relKE(ha,hb);
  const mx=(ha.x+hb.x)/2,my=(ha.y+hb.y)/2;
  const cmvx=(ha.vx+hb.vx)*0.5,cmvy=(ha.vy+hb.vy)*0.5;
  const bnBefore=baryonNum(ha.nq)+baryonNum(hb.nq);
  addSparks(mx,my,rke>KE_MULTI?20:10,rke>KE_MULTI);
  const newH=[];
  if((ha.nq===3&&hb.nq===-3)||(ha.nq===-3&&hb.nq===3)){
    const nm=2+Math.floor(rke*1.5);
    for(let i=0;i<nm;i++){const a=(i/nm)*Math.PI*2+Math.random()*0.3;const h=new Hadron(mx+Math.cos(a)*20,my+Math.sin(a)*20,2);h.vx=cmvx+Math.cos(a)*1.0;h.vy=cmvy+Math.sin(a)*1.0;newH.push(h);}
    setStatus(`B + B̄ → ${nm}M  (annihilation)`);
  } else if(ha.nq===3&&hb.nq===3){
    if(rke>=KE_MULTI){
      const np=nPairsFromKE(rke);
      const formed=formHadrons(mx,my,6+np,np,cmvx,cmvy);
      ensureBaryonNumber(formed,2);newH.push(...formed);
      const bC=formed.filter(h=>h.nq===3).length,bBarC=formed.filter(h=>h.nq===-3).length,mC=formed.filter(h=>Math.abs(h.nq)===2).length;
      setStatus(`B+B → ${bC}B+${bBarC}B̄+${mC}M  (${np} qq̄, rKE=${rke.toFixed(1)})`);
    } else if(rke>=KE_INELASTIC){
      const h1=new Hadron(mx-22,my+(-6+Math.random()*12),3),h2=new Hadron(mx+22,my+(-6+Math.random()*12),3);
      const hm1=new Hadron(mx+(-10+Math.random()*20),my-20,2),hm2=new Hadron(mx+(-10+Math.random()*20),my+20,2);
      [h1,h2,hm1,hm2].forEach(h=>{const a=Math.atan2(h.y-my,h.x-mx);h.vx=cmvx+Math.cos(a)*0.7;h.vy=cmvy+Math.sin(a)*0.7;});
      newH.push(h1,h2,hm1,hm2);setStatus(`B+B → B+B+M+M  (inelastic, rKE=${rke.toFixed(1)})`);
    } else {
      const h1=new Hadron(mx-22,my+(-6+Math.random()*12),3),h2=new Hadron(mx+22,my+(-6+Math.random()*12),3);
      [h1,h2].forEach(h=>{const a=Math.atan2(h.y-my,h.x-mx);h.vx=cmvx+Math.cos(a)*0.8;h.vy=cmvy+Math.sin(a)*0.8;});
      newH.push(h1,h2);setStatus(`B+B → B+B  (elastic)`);
    }
  } else if(ha.nq===-3&&hb.nq===-3){
    const h1=new Hadron(mx-22,my+(-6+Math.random()*12),-3),h2=new Hadron(mx+22,my+(-6+Math.random()*12),-3);
    [h1,h2].forEach(h=>{const a=Math.atan2(h.y-my,h.x-mx);h.vx=cmvx+Math.cos(a)*0.8;h.vy=cmvy+Math.sin(a)*0.8;});
    newH.push(h1,h2);setStatus('B̄+B̄ → B̄+B̄');
  } else if((Math.abs(ha.nq)===3&&Math.abs(hb.nq)===2)||(Math.abs(ha.nq)===2&&Math.abs(hb.nq)===3)){
    const bNq=Math.abs(ha.nq)===3?ha.nq:hb.nq;
    if(rke>=KE_INELASTIC){
      const nm=1+Math.floor(rke*0.8);
      const hOut=new Hadron(mx-20,my,bNq);hOut.vx=cmvx-0.5;hOut.vy=cmvy;newH.push(hOut);
      for(let i=0;i<nm;i++){const a=Math.random()*Math.PI*2;const hm=new Hadron(mx+Math.cos(a)*22,my+Math.sin(a)*22,2);hm.vx=cmvx+Math.cos(a)*0.9;hm.vy=cmvy+Math.sin(a)*0.9;newH.push(hm);}
      ensureBaryonNumber(newH,bnBefore);setStatus(`B+M → B+${nm}M  (rKE=${rke.toFixed(1)})`);
    } else {
      const h1=new Hadron(mx-20,my+(-6+Math.random()*12),bNq),h2=new Hadron(mx+20,my+(-6+Math.random()*12),2);
      [h1,h2].forEach(h=>{const a=Math.atan2(h.y-my,h.x-mx);h.vx=cmvx+Math.cos(a)*0.8;h.vy=cmvy+Math.sin(a)*0.8;});
      newH.push(h1,h2);setStatus('B+M → B+M');
    }
  } else {
    const h1=new Hadron(mx-18,my+(-6+Math.random()*12),2),h2=new Hadron(mx+18,my+(-6+Math.random()*12),2);
    [h1,h2].forEach(h=>{const a=Math.atan2(h.y-my,h.x-mx);h.vx=cmvx+Math.cos(a)*0.8;h.vy=cmvy+Math.sin(a)*0.8;});
    newH.push(h1,h2);setStatus('M+M → M+M');
  }
  if(newH.length>0)ensureBaryonNumber(newH,bnBefore);
  hadrons.splice(Math.max(ia,ib),1);hadrons.splice(Math.min(ia,ib),1);
  hadrons.push(...newH);
  const globalSpeed=parseFloat(slS.value)/100;
  interactCooldown=Math.floor(45/Math.max(globalSpeed*3,0.3));
}

function drawClusterHulls(clusters){
  clusters.forEach(members=>{
    if(members.length<2)return;
    const cx=members.reduce((s,h)=>s+h.x,0)/members.length,cy=members.reduce((s,h)=>s+h.y,0)/members.length;
    const r=members.reduce((mx,h)=>Math.max(mx,Math.sqrt((h.x-cx)**2+(h.y-cy)**2)),0)+R_H+4;
    ctx.save();ctx.setLineDash([6,8]);
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle=fg(0.06);ctx.lineWidth=0.6;ctx.stroke();
    ctx.setLineDash([]);ctx.restore();
    ctx.fillStyle=fg(0.15);ctx.font='10px sans-serif';ctx.textAlign='center';
    ctx.fillText(`N=${members.length}`,cx,cy-r-4);
  });
}

function loop(){
  const speed=parseFloat(slS.value)/100*3.0;
  ctx.clearRect(0,0,W,H);
  const steps=Math.max(1,Math.round(speed));
  for(let s=0;s<steps;s++){
    if(speed>0.05){
      applyForces();
      hadrons.forEach(h=>h.move());
      // 吸収と2体衝突を独立に毎フレーム試みる
      if(frame%Math.max(1,Math.floor(8/Math.max(speed,0.1)))===0){
        tryAbsorption();
        tryCollision();
      }
    }
    frame++;
  }
  drawClusterHulls(detectClusters(hadrons));
  const drawnB=new Set(),drawnA=new Set();
  hadrons.forEach((ha,i)=>{
    if(ha.bond){const j=hadrons.findIndex(h=>h.id===ha.bond);if(j>=0){const key=[Math.min(i,j),Math.max(i,j)].join('-');if(!drawnB.has(key)){drawnB.add(key);const hb=hadrons[j],d=Math.sqrt((hb.x-ha.x)**2+(hb.y-ha.y)**2);const f=bbForce(d);drawLine(ha,hb,f>0?[4,5]:[2,3],Math.min(0.25,Math.abs(f)*9),f>0?0.9:0.6);}}}
    if(ha.attract){const j=hadrons.findIndex(h=>h.id===ha.attract);if(j>=0){const key=[Math.min(i,j),Math.max(i,j)].join('-');if(!drawnA.has(key)){drawnA.add(key);const hb=hadrons[j],d=Math.sqrt((hb.x-ha.x)**2+(hb.y-ha.y)**2);drawLine(ha,hb,[3,6],Math.max(0,1-d/200)*0.18,0.7);}}}
  });
  sparks=sparks.filter(s=>s.life>0);
  sparks.forEach(s=>{ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=fg(s.life*0.65);ctx.fill();s.x+=s.vx;s.y+=s.vy;s.vx*=0.93;s.vy*=0.93;s.life-=0.020;});
  hadrons.forEach(h=>h.draw(speed<0.05?0.4:Math.min(1,speed*0.8+0.3)));
  const bC=hadrons.filter(h=>h.nq===3).length,bBarC=hadrons.filter(h=>h.nq===-3).length,mC=hadrons.filter(h=>Math.abs(h.nq)===2).length;
  const cl=detectClusters(hadrons);const maxN=cl.size>0?Math.max(...[...cl.values()].map(m=>m.length)):1;
  if(statusTimer>0){statusTimer--;if(statusTimer===0)statusText='';}
  if(pauliEventTimer>0)pauliEventTimer--;
  statusEl.textContent=`B:${bC}  B̄:${bBarC}  M:${mC}  |  B#=${bC-bBarC}  |  N=${maxN}${pauliEventTimer>0?'  ⊘Pauli':''}${statusText?'   '+statusText:''}`;
  requestAnimationFrame(loop);
}

slB.addEventListener('input',()=>{valB.textContent=slB.value;});
slM.addEventListener('input',()=>{valM.textContent=slM.value;});
document.getElementById('btnReset').addEventListener('click',()=>{init();sparks=[];statusText='';});
loop();
</script>
