
<style>
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e0e0e; --fg: rgba(255,255,255,0.85); --fg2: rgba(255,255,255,0.35); --fg3: rgba(255,255,255,0.12); --acc: rgba(255,255,255,0.9); }
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f8f7f4; --fg: rgba(0,0,0,0.82); --fg2: rgba(0,0,0,0.35); --fg3: rgba(0,0,0,0.10); --acc: rgba(0,0,0,0.88); }
  }
  .wrap { position: relative; width: 100%; height: 500px; overflow: hidden; background: var(--bg); border-radius: 12px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .ui { position: absolute; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px 24px; }
  .stage-info { }
  .stage-num { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg2); margin-bottom: 5px; }
  .stage-text { font-size: 14px; color: var(--fg); max-width: 340px; line-height: 1.5; }
  .bottom-row { display: flex; align-items: flex-end; justify-content: space-between; }
  .ticks { display: flex; gap: 6px; align-items: center; }
  .tick { width: 20px; height: 2px; background: var(--fg3); border-radius: 1px; transition: background 0.3s; }
  .tick.active { background: var(--fg); }
  .hint { font-size: 11px; color: var(--fg2); }
</style>

<div class="wrap" id="wrap">
  <canvas id="cv"></canvas>
  <div class="ui">
    <div class="stage-info">
      <div class="stage-num" id="snum">— 1 / 5</div>
      <div class="stage-text" id="stxt">二つの重原子核が衝突</div>
    </div>
    <div class="bottom-row">
      <div class="ticks" id="ticks">
        <div class="tick active"></div>
        <div class="tick"></div>
        <div class="tick"></div>
        <div class="tick"></div>
        <div class="tick"></div>
      </div>
      <div class="hint">scroll to advance</div>
    </div>
  </div>
</div>

<script>
const wrap = document.getElementById('wrap');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const snumEl = document.getElementById('snum');
const stxtEl = document.getElementById('stxt');
const tickEls = document.getElementById('ticks').querySelectorAll('.tick');

let W, H, prog = 0, target = 0, raf;
const isDark = () => window.matchMedia('(prefers-color-scheme: dark)').matches;

function resize() {
  W = cv.width = wrap.offsetWidth;
  H = cv.height = wrap.offsetHeight;
}
resize();
window.addEventListener('resize', resize);

const stages = [
  { t: 0,    n: "— 1 / 5", txt: "二つの重原子核が正面衝突" },
  { t: 0.18, n: "— 2 / 5", txt: "衝突点からクォークとグルーオンが大量に生成され飛び散る" },
  { t: 0.38, n: "— 3 / 5", txt: "クォーク・グルーオン・プラズマ（QGP）が膨張する" },
  { t: 0.60, n: "— 4 / 5", txt: "冷却とともにクォークが集まりハドロンを形成し始める" },
  { t: 0.80, n: "— 5 / 5", txt: "多数のハドロン（パイ中間子、陽子、中性子など）が外側へ飛散" },
];

// seed particles
const N = 320;
const parts = Array.from({length: N}, (_, i) => {
  const a = Math.random() * Math.PI * 2;
  const spd = 0.4 + Math.random() * 2.2;
  return {
    a, spd,
    x: 0, y: 0,
    r: 0.6 + Math.random() * 1.2,
    kind: i < N * 0.65 ? 'q' : 'g', // quark or gluon
    phase: Math.random() * Math.PI * 2,
  };
});

// hadron clusters: groups of 2-3 quarks that bind
const hadrons = Array.from({length: 55}, () => {
  const a = Math.random() * Math.PI * 2;
  const spd = 0.3 + Math.random() * 1.4;
  const n = Math.random() < 0.6 ? 3 : 2;
  return { a, spd, n, r: n === 3 ? 5.5 : 4.5, phase: Math.random() * Math.PI * 2 };
});

function fgColor(alpha) {
  return isDark()
    ? `rgba(255,255,255,${alpha})`
    : `rgba(0,0,0,${alpha})`;
}

function draw(p) {
  ctx.clearRect(0, 0, W, H);
  const cx = W / 2, cy = H / 2;
  const t = Date.now() / 1000;

  // --- Stage 1: two nuclei approaching (p < 0.18) ---
  if (p < 0.25) {
    const fade = Math.max(0, 1 - p / 0.15);
    const sep = (1 - Math.min(p / 0.15, 1)) * W * 0.22 + 18;

    [-1, 1].forEach(side => {
      const nx = cx + side * sep;
      drawNucleus(nx, cy, 22, fade * 0.9, p / 0.15);
    });
  }

  // --- Stage 2+: particle explosion ---
  if (p > 0.12) {
    const ef = Math.min((p - 0.12) / 0.12, 1);
    const maxR = Math.min(W, H) * 0.48 * ef;

    parts.forEach((pt, i) => {
      const x = cx + Math.cos(pt.a) * maxR * pt.spd / 2.2;
      const y = cy + Math.sin(pt.a) * maxR * pt.spd / 2.2;
      pt.x = x; pt.y = y;

      const dist = maxR * pt.spd / 2.2;
      if (dist > Math.min(W, H) * 0.52) return;

      // quark: small filled dot; gluon: small ring
      const alpha = ef * (0.5 + 0.35 * Math.sin(pt.phase + t * 1.8 + i * 0.3));
      if (pt.kind === 'q') {
        ctx.beginPath();
        ctx.arc(x, y, pt.r, 0, Math.PI * 2);
        ctx.fillStyle = fgColor(alpha * 0.85);
        ctx.fill();
      } else {
        ctx.beginPath();
        ctx.arc(x, y, pt.r + 0.8, 0, Math.PI * 2);
        ctx.strokeStyle = fgColor(alpha * 0.6);
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }
    });

    // color flux tubes between nearby quarks (QGP strings)
    if (p < 0.62) {
      const stringFade = p < 0.38
        ? Math.min((p - 0.12) / 0.15, 1)
        : Math.max(0, 1 - (p - 0.38) / 0.22);
      if (stringFade > 0.05) {
        ctx.save();
        for (let i = 0; i < parts.length; i += 4) {
          const j = (i + 7) % parts.length;
          const dx = parts[j].x - parts[i].x;
          const dy = parts[j].y - parts[i].y;
          const d = Math.sqrt(dx * dx + dy * dy);
          if (d < 60 && d > 5) {
            ctx.beginPath();
            ctx.moveTo(parts[i].x, parts[i].y);
            ctx.lineTo(parts[j].x, parts[j].y);
            ctx.strokeStyle = fgColor(stringFade * 0.13);
            ctx.lineWidth = 0.4;
            ctx.stroke();
          }
        }
        ctx.restore();
      }
    }
  }

  // --- Stage 4+: hadron formation ---
  if (p > 0.55) {
    const hf = Math.min((p - 0.55) / 0.18, 1);
    const maxR = Math.min(W, H) * 0.48 * Math.min(p / 0.5, 1);

    hadrons.forEach((h, i) => {
      const dist = maxR * h.spd / 1.4;
      if (dist > Math.min(W, H) * 0.52) return;
      const hx = cx + Math.cos(h.a) * dist;
      const hy = cy + Math.sin(h.a) * dist;

      const pulse = 1 + 0.08 * Math.sin(h.phase + t * 2.2 + i);
      const alpha = hf * 0.82;

      // hadron = filled circle with dot cluster inside
      ctx.beginPath();
      ctx.arc(hx, hy, h.r * pulse, 0, Math.PI * 2);
      ctx.strokeStyle = fgColor(alpha);
      ctx.lineWidth = 0.9;
      ctx.stroke();

      // inner quark dots
      for (let q = 0; q < h.n; q++) {
        const qa = (q / h.n) * Math.PI * 2 + h.phase + t * 0.6;
        const qr = h.r * 0.42;
        ctx.beginPath();
        ctx.arc(hx + Math.cos(qa) * qr, hy + Math.sin(qa) * qr, 0.9, 0, Math.PI * 2);
        ctx.fillStyle = fgColor(alpha * 0.9);
        ctx.fill();
      }
    });
  }

  // --- radial density ripple (expansion front) ---
  if (p > 0.22 && p < 0.85) {
    const rp = Math.min((p - 0.22) / 0.5, 1);
    const baseR = rp * Math.min(W, H) * 0.44;
    const rippleAlpha = Math.max(0, 0.18 - rp * 0.18);
    ctx.beginPath();
    ctx.arc(cx, cy, baseR, 0, Math.PI * 2);
    ctx.strokeStyle = fgColor(rippleAlpha);
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // stage UI
  let curStage = stages[0], curIdx = 0;
  stages.forEach((s, i) => { if (p >= s.t) { curStage = s; curIdx = i; } });
  snumEl.textContent = curStage.n;
  stxtEl.textContent = curStage.txt;
  tickEls.forEach((el, i) => el.classList.toggle('active', i === curIdx));
}

function drawNucleus(nx, ny, radius, alpha, squeeze) {
  const scx = 1 - squeeze * 0.7;
  ctx.save();
  ctx.translate(nx, ny);
  ctx.scale(scx, 1);
  // nucleon dots
  for (let i = 0; i < 28; i++) {
    const a = (i / 28) * Math.PI * 2 + i * 0.4;
    const r = radius * (0.3 + 0.65 * ((i * 7919) % 17) / 17);
    ctx.beginPath();
    ctx.arc(Math.cos(a) * r, Math.sin(a) * r, 1.4, 0, Math.PI * 2);
    ctx.fillStyle = fgColor(alpha * 0.75);
    ctx.fill();
  }
  // outline
  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  ctx.strokeStyle = fgColor(alpha * 0.4);
  ctx.lineWidth = 0.8;
  ctx.stroke();
  ctx.restore();
}

function loop() {
  prog += (target - prog) * 0.055;
  draw(prog);
  raf = requestAnimationFrame(loop);
}

wrap.addEventListener('wheel', e => {
  e.preventDefault();
  target = Math.max(0, Math.min(1, target + e.deltaY / 800));
}, { passive: false });

let ty0 = 0;
wrap.addEventListener('touchstart', e => { ty0 = e.touches[0].clientY; });
wrap.addEventListener('touchmove', e => {
  e.preventDefault();
  const dy = ty0 - e.touches[0].clientY;
  ty0 = e.touches[0].clientY;
  target = Math.max(0, Math.min(1, target + dy / 350));
}, { passive: false });

loop();
</script>
